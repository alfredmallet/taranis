<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plasma turbulence in your browser &mdash; driven by music</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- NO analytics beacon and NO link to or from the other pages: this page is a development
     build of plans-webgpu/MUSIC_PLAN.md (phase M2), not yet a public one. The audio never
     leaves the browser: it is analysed in this page and nothing derived from it is sent
     anywhere. -->
</head>
<body>
<h1>plasma turbulence, driven by music</h1>
<div class="sub">2D RMHD &middot; 256&sup2; &middot; every onset in a frequency band is an
  impulsive kick of gaussian blobs &middot; bass &rarr; wide blobs, treble &rarr; narrow &middot;
  the audio clock sets the simulation time</div>

<!-- the sticky bar and the control panel are BUILT from a spec (common.js controlsBuild) -->
<div id="topbar"></div>
<div id="controls">
  <!-- the one control controlsBuild has no kind for: a local audio file. Shown only when
       the source is "audio file" (syncLabels). The file is decoded in this page. -->
  <div class="row" id="rowFile" style="display:none">
    <label for="fMusic">audio file</label>
    <input type="file" id="fMusic" accept="audio/*">
    <span class="hint" id="vFile"></span>
  </div>
</div>
<div id="status"></div>

<div id="display">
  <div id="displaycol">
    <div id="displays"></div>
    <div id="readout">initialising&hellip;</div>
  </div>
  <div id="charts"></div>
</div>

<div class="hint" id="buildline" style="margin-top:4px">
  build <span class="buildid">dev</span>
</div>

<script src="common.js"></script>
<script src="physics.js"></script>
<script src="solver2d.js"></script>
<script src="music.js"></script>
<script>
"use strict";
// ===========================================================================
// music.html -- the AUDIO and DOM glue of the music page. The logic it drives is
// music.js (pure: the band plan, the onset detector, the blobs, the click track,
// the clock) and the solver is solver2d.js's, built with `kick: true` and a drag.
// plans-webgpu/MUSIC_PLAN.md, phases M2-M4; developer notes in README.md.
// Four sources: the built-in click track, a local file, another tab's audio
// (getDisplayMedia) and an audio input device (getUserMedia). The detector always
// reads the source UNDELAYED; where the page is the one playing it, the speakers
// get it through a delay, so a hit is on screen when it is heard.
//
// One frame, in order (musicStep, called by common.js's loop through `stepHook`):
//   1. read the analyser's spectrum and hand it to the detector;
//   2. ONE solver.kick() per onset it declares -- never a merged list;
//   3. ask the clock how many steps the audio clock wants, and return that.
// The loop then takes those steps, renders, and reads the stats back; the next
// frame's count is computed from that readback.
// ===========================================================================

// ---- what this page fixes (MUSIC_PLAN decisions) ---------------------------
const MUSIC_N = 256;               // the grid: live music is a 256^2 feature (M0.c)
const MUSIC_HYPER = 4;             // k^8, with the offline dissipation rule below
const MUSIC_FPS = 60;              // the detector's nominal frame rate
const MUSIC_NFFT = 2048;           // the analyser's window: 46 ms at 44.1 kHz
const MUSIC_MAX_STEPS = 64;        // per frame, the cap `stepsPerFrame` has always had
const MUSIC_LAG_MAX = 0.25;        // seconds of audio: beyond it, rebase instead of catching up
const MUSIC_SEED = 1;              // blob positions: the same session replays the same blobs
// ?musicdebug: keep a per-kick and per-frame record on window.musicDebug (see musicDebugInit).
// ?musicdebug=energy additionally reads the energy back after EVERY kick: that is the only
// way to get a kick's own energy jump, and it costs a GPU round trip per kick, so the
// timing numbers are best taken without it.
const MUSIC_DEBUG = typeof location !== "undefined" && /[?&]musicdebug\b/.test(location.search);
const MUSIC_DEBUG_E = typeof location !== "undefined" && /[?&]musicdebug=energy\b/.test(location.search);

// ---- colormaps: magma and brat, on this page only ----------------------------
// registered before any card or solver exists; their indices follow the shared four
cmapExtend(MUSIC_CMAPS);
const MUSIC_CMAP_DEFAULT = CMAP_NAMES.length + MUSIC_CMAPS.findIndex(m => m.name === "magma");

// ---- controls ---------------------------------------------------------------
controlsBuild({
  topbar: [
    { k: "btn", id: "btnRun", t: "Start" },
    { k: "btn", id: "btnReset", t: "Reset" },
    { k: "lab", t: "source", for: "selSrc" },
    { k: "sel", id: "selSrc", o: [["click", "click track"], ["file", "audio file"],
                                  ["tab", "another tab's audio (Chrome / Edge)"], ["input", "audio input device"]], v: "click" },
    { k: "txt", id: "steps" }
  ],
  groups: [
    { id: "grpMusic", summary: "music", keep: true, rows: [
      [{ k: "lab", t: "threshold" },
       { k: "rng", id: "rThr", min: 0.05, max: 1, step: 0.05, v: 0.3,
         ti: "how far above its recent mean a band's spectral flux must rise to count as an "
           + "onset; raise it to keep only the stronger hits" },
       { k: "val", id: "vThr" },
       { k: "lab", t: "memory (s)" },
       { k: "rng", id: "rMem", min: 0.2, max: 3, step: 0.1, v: 1,
         ti: "the energy e-folding time of the uniform drag, in seconds of audio: how many "
           + "beats the flow remembers" },
       { k: "val", id: "vMem" }],
      [{ k: "lab", t: "amp" },
       { k: "rng", id: "rMAmp", min: 0.1, max: 3, step: 0.1, v: 1,
         ti: "peak |grad z| a full-strength blob adds to its Elsasser channel" },
       { k: "val", id: "vMAmp" },
       { k: "lab", t: "rate" },
       { k: "rng", id: "rRate", min: 0.25, max: 2, step: 0.05, v: 1,
         ti: "simulation time units per second of audio" },
       { k: "val", id: "vRate" },
       { k: "lab", t: "click bpm" },
       { k: "num", id: "nBpm", v: 120, w: 70 }],
      [{ k: "lab", t: "sync trim (ms)" },
       { k: "rng", id: "rTrim", min: -MUSIC_TRIM_MAX, max: MUSIC_TRIM_MAX, step: 5, v: 0,
         ti: "sound and picture are lined up automatically from the audio output's latency "
           + "(the line below says how). If they still look off, this nudges it: positive "
           + "makes the PICTURE later, negative the sound later." },
       { k: "val", id: "vTrim" }],
      { id: "rowDev", hide: true, items: [
        { k: "lab", t: "input device", for: "selDev" },
        { k: "sel", id: "selDev", o: [["", "default input"]],
          ti: "a loopback driver, or a microphone. Names appear once access has been allowed." }] },
      { k: "hintdiv", id: "musicMode", t: "" },
      { k: "hintdiv", id: "musicStrip", t: "" }
    ] },
    // the two CFL knobs the shared loop reads (rCflEvery) and the solver takes (rCfl)
    { id: "grpSim", summary: "simulation", rows: [CTRL_CFL] },
    ctrlGrpDisp()
  ]
});

// ---- what the controls say ----------------------------------------------------
const musicNum = (id, dflt) => { const v = parseFloat(el(id).value); return isFinite(v) ? v : dflt; };
function musicUi() {
  return { thr: musicNum("rThr", 0.3), memory: Math.max(0.05, musicNum("rMem", 1)),
           amp: Math.max(0, musicNum("rMAmp", 1)), rate: Math.max(0.01, musicNum("rRate", 1)),
           bpm: Math.min(300, Math.max(30, musicNum("nBpm", 120))), src: el("selSrc").value,
           trim: Math.min(MUSIC_TRIM_MAX, Math.max(-MUSIC_TRIM_MAX, musicNum("rTrim", 0))),
           dev: el("selDev").value };
}
// the drag's energy e-folding RATE, in simulation time: the flow forgets over `memory`
// seconds of AUDIO, which is memory * rate simulation time units
const musicMu = u => 1 / (u.memory * u.rate);
// the offline script's dissipation rule: the hyperviscous rate nu*k^(2*hyper) is 48*amp at
// the dealiasing cutoff k = n/3, whatever the order. It scales with amp because the strain
// it has to beat does; a rate of ~5-12 there leaves a grid-scale pile-up no timestep fixes.
// At hyper 4 (k^8) the rate falls to 3*amp at k = n/4.2 (60 at 256^2) where hyper 2 (k^4,
// the rule's first form, 3*amp/(n/6)^4 -- the same number) reached it at n/6 (43): a
// sharper cutoff and ~1.4x more undamped range.
const musicDiss = u => 48 * Math.max(u.amp, 0.1) / Math.pow(MUSIC_N / 3, 2 * MUSIC_HYPER);

function uiParams() {
  const u = musicUi();
  return {
    nx: MUSIC_N, ny: MUSIC_N, Lx: MUSIC_LBOX, Ly: MUSIC_LBOX,
    hyper: MUSIC_HYPER, diss: musicDiss(u), pm: 1, eqsrc: false,
    // no OU forcing at all: the Solver's own defaults are epsP = epsM = 0.15, and left
    // alone the shell forcing would run underneath the kicks
    epsP: 0, epsM: 0, tau: 1, fshell: [1, 3], smax: 1e4,
    cfl: musicNum("rCfl", 0.4), seed: 7,
    kick: true, mu: musicMu(u)
  };
}
function cardAspect() { return { w: 512, h: 512 }; }

// ---- the page's state -------------------------------------------------------
const music = {
  plan: musicBandPlan(MUSIC_N, null, null, KICK_MAX),   // widths and counts, one kick() each
  rng: musicRng(MUSIC_SEED),
  det: null,                // the onset detector (built at Start, at the context's rate)
  audio: null,              // the live source (musicStart): { ctx, an, node, delay, t0, kind,
                            //   click, stream, route, suppressed, surface, sync }
  queue: [],                // onsets waiting out the kick hold-back: { due, o } in arrival order
  syncAt: -1e9,             // audio time the output latency was last read
  hidden: false,            // the page was hidden since the last frame (visibilitychange)
  gen: 0,                   // bumped by every Start and Stop: an await that outlives it gives up
  clock: {},                // musicClock's state
  tPush: null,              // audio time of the last spectrum handed to the detector
  db: null, mag: null,      // the analyser's dB bins, and their magnitudes
  lit: [],                  // per band: performance.now() of its last onset (the strip)
  behind: false, dropped: 0, lastFile: null
};
for (let b = 0; b < music.plan.sigmas.length; b++) music.lit.push(-1e9);

function syncLabels() {
  const u = musicUi();
  el("vThr").textContent = u.thr.toFixed(2);
  el("vMem").textContent = u.memory.toFixed(1);
  el("vMAmp").textContent = u.amp.toFixed(1);
  el("vRate").textContent = u.rate.toFixed(2);
  el("vCfl").textContent = musicNum("rCfl", 0.4).toFixed(2);
  el("vCflEvery").textContent = el("rCflEvery").value;
  el("vTrim").textContent = (u.trim > 0 ? "+" : "") + u.trim.toFixed(0);
  el("rowFile").style.display = u.src === "file" ? "" : "none";
  el("rowDev").style.display = u.src === "input" ? "" : "none";
  musicModeLine();
  musicStrip();
}
// the per-band activity strip and the "behind" indicator: one line of text, rebuilt each
// frame (a band is lit for 120 ms after its onset)
function musicStrip() {
  const now = performance.now(), det = music.det, parts = [];
  for (let b = 0; b < music.plan.sigmas.length; b++) {
    const on = now - music.lit[b] < 120;
    const f = det ? Math.round(det.edges[b]) + "–" + Math.round(det.edges[b + 1]) + " Hz" : "band " + b;
    parts.push((on ? "● " : "○ ") + f + " σ " + music.plan.sigmas[b].toFixed(3)
               + " ×" + music.plan.nblobs[b]);
  }
  el("musicStrip").textContent = parts.join("   |   ")
    + (music.behind ? "   |   BEHIND: the simulation cannot keep up with the audio" : "")
    + (music.dropped ? "   |   " + music.dropped + " blobs dropped" : "");
}

// slider -> the live solver. The drag and the dissipation share one column of gridB, so
// they are uploaded together: set diss, then setDrag rebuilds from (diss, hyper, mu).
function applyControls() {
  syncLabels();
  const u = musicUi();
  if (music.det) music.det.threshold = u.thr;
  if (!solver) return;
  const q = uiParams();
  solver.p.cfl = q.cfl;
  solver.uploadCfg();
  if (q.diss !== solver.p.diss || q.mu !== solver.p.mu) { solver.p.diss = q.diss; solver.setDrag(q.mu); }
}
// the initial condition is always rest: the music makes the flow
function applyIC() {
  if (!solver) return;
  solver.setIC(true);
  music.clock.init = false;         // the simulation time jumped back to 0: re-anchor
  music.queue.length = 0;           // ... and nothing detected before it belongs to the new run
  spsSmooth = 0;
  chartsReset();
}
function rebuild() {
  // never destroy in an event handler: the frame loop may be awaiting a readback on the
  // old solver's buffers. Retire it and free it at the top of a later frame.
  if (solver) { graveyard.push(solver); solver = null; }
  solver = new Solver(device, uiParams());
  cardsSync();
  stepsPerFrame = 1;
  applyIC();
}

// ---- audio -------------------------------------------------------------------
// The context is created on the Start click (browsers refuse audio before a gesture).
// Whatever the source, the graph is
//
//     source ──> analyser                       (what the detector reads: UNDELAYED)
//        └─────> delay ──> speakers             (only if musicRouting says the page may play it)
//
// and the sound and the picture are lined up by musicSync (music.js) from the audio
// output's latency: where the output is quick the SOUND is delayed (the delay node), where
// it is slow -- Bluetooth -- the KICKS are held back instead (music.queue). An input device
// has no second branch at all.
function musicAudioClass() { return window.AudioContext || window.webkitAudioContext || null; }
const musicMedia = () => (typeof navigator !== "undefined" && navigator.mediaDevices) || null;
// the run button says what it does: Stop is a full stop (a file starts again from its
// beginning, a capture is released), not a pause
function musicRunning(b) {
  setRunning(b);
  el("btnRun").textContent = b ? "Stop" : "Start";
}

// the sync in force for a live source: read the output latency, and move the delay node
// (smoothly: a jump in a delay line clicks) and the hold-back to match
function musicSyncApply(A, now) {
  const u = musicUi();
  const sy = musicSync({ kind: A.kind, play: A.route.play, outputLatency: A.ctx.outputLatency, trimMs: u.trim });
  if (A.delay) {
    const p = A.delay.delayTime;
    if (now || !p.setTargetAtTime) p.value = sy.D;
    else p.setTargetAtTime(sy.D, A.ctx.currentTime, 0.05);
  }
  A.sync = sy;
  music.syncAt = A.ctx.currentTime - A.t0;
  if (MUSIC_DEBUG && window.musicDebug) window.musicDebug.audio = musicDebugAudio(A);
  return sy;
}
// One line saying what is in force, and why (musicSyncText + musicRouting's sentence).
function musicModeLine() {
  const A = music.audio, u = musicUi();
  let t;
  if (A) t = musicSyncText(A.sync, A.route.why);
  else if (u.src === "tab") t = "another tab's audio: whether the page can play it (and so delay the sound) is decided at Start";
  else {
    const r = musicRouting(u.src, false);
    t = musicSyncText(musicSync({ kind: u.src, play: r.play, outputLatency: music.ctx ? music.ctx.outputLatency : 0, trimMs: u.trim }), r.why);
  }
  el("musicMode").textContent = t;
}
// the input-device list. Labels are empty until access has been allowed once, so this is
// called again after a successful getUserMedia; the current choice is kept if it survives.
async function musicDevices() {
  const md = musicMedia(), sel = el("selDev");
  if (!md || !md.enumerateDevices) return;
  md.ondevicechange = () => { musicDevices(); };   // a device plugged in or pulled: read it again
  let list = [];
  try { list = (await md.enumerateDevices()).filter(d => d.kind === "audioinput"); } catch (e) { return; }
  const keep = sel.value;
  sel.innerHTML = "";
  const add = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
  add("", "default input");
  list.forEach((d, i) => { if (d.deviceId && d.deviceId !== "default") add(d.deviceId, d.label || "audio input " + (i + 1)); });
  sel.value = Array.from(sel.options).some(o => o.value === keep) ? keep : "";
}
// end a capture: every track stopped (which is also what clears Chrome's "sharing" bar and
// the microphone indicator)
function musicStopStream(stream) {
  if (!stream) return;
  for (const t of stream.getTracks()) { t.onended = null; try { t.stop(); } catch (e) { /* already ended */ } }
}

// Obtain the source: a node to analyse, plus what goes with it. Throws { name } on failure
// (musicStartError turns the name into the message). `ctx` exists already. A capture that
// was GRANTED and then cannot be used -- no audio track, or anything throwing while it is
// being wrapped -- is stopped before the throw leaves here: a stream nobody holds would
// keep the sharing bar or the microphone indicator on with no way to turn it off.
async function musicAcquire(kind, ctx, u) {
  if (kind === "click") {
    const click = musicClickTrack({ sr: ctx.sampleRate, bpm: u.bpm, beats: 16, seed: 1 });
    const buffer = ctx.createBuffer(1, click.samples.length, ctx.sampleRate);
    buffer.getChannelData(0).set(click.samples);
    const node = ctx.createBufferSource();
    node.buffer = buffer;
    node.loop = true;                              // the click track is a seamless loop
    return { node: node, click: click, stream: null, suppressed: null, surface: null, label: "click track, " + u.bpm + " bpm" };
  }
  if (kind === "file") {
    const f = el("fMusic").files && el("fMusic").files[0];
    if (!f) throw { name: "nofile" };
    let buffer;
    try { buffer = await ctx.decodeAudioData(await f.arrayBuffer()); }
    catch (e) { throw { name: "decode", file: f.name, detail: e && e.message || String(e) }; }
    el("vFile").textContent = f.name + ", " + buffer.duration.toFixed(1) + " s";
    const node = ctx.createBufferSource();
    node.buffer = buffer;
    return { node: node, click: null, stream: null, suppressed: null, surface: null, label: f.name };
  }
  const md = musicMedia();
  if (kind !== "tab" && kind !== "input") throw { name: "unknown source" };
  if (!md || !(kind === "tab" ? md.getDisplayMedia : md.getUserMedia)) throw { name: "unsupported" };
  const stream = kind === "tab" ? await md.getDisplayMedia(musicTabConstraints())
                                : await md.getUserMedia(musicInputConstraints(u.dev));
  try {
    const at = stream.getAudioTracks()[0];
    if (!at) throw { name: "noaudio" };
    const st = at.getSettings ? at.getSettings() : {};
    // The tab capture's VIDEO track is unused, and it is KEPT ALIVE: whether stopping it
    // leaves the audio running is browser behaviour this code cannot check, and a dead
    // audio track would be silent with no error. It was asked for at 64 px, 1 frame a second.
    const vt = stream.getVideoTracks()[0], vs = vt && vt.getSettings ? vt.getSettings() : {};
    return { node: ctx.createMediaStreamSource(stream), click: null, stream: stream,
             suppressed: kind === "tab" ? st.suppressLocalAudioPlayback === true : null,
             surface: kind === "tab" ? (vs.displaySurface || null) : null,
             label: at.label || (kind === "tab" ? "a tab" : "audio input"), settings: st };
  } catch (e) { musicStopStream(stream); throw e; }
}

async function musicStart() {
  if (music.audio || music.starting) return;
  const AC = musicAudioClass(), u = musicUi(), kind = u.src;
  if (!AC) { showStatus("this browser has no Web Audio (AudioContext)", "err"); return; }
  const ctx = music.ctx || (music.ctx = new AC());
  const gen = ++music.gen;
  // `starting` stays true until this function has finished or given up, across EVERY await
  // below: a second click, or a change of source, in any of those windows must find it set
  music.starting = true;
  let S = null;
  try {
    try { S = await musicAcquire(kind, ctx, u); }
    catch (e) {
      const n = e && e.name;
      showStatus(n === "nofile" ? "choose an audio file first"
               : n === "decode" ? "could not decode " + e.file + ": " + e.detail
               : musicStartError(kind, e, musicTabAudioLikely(musicMedia())), n === "nofile" ? "info" : "err");
      return;
    }
    if (ctx.state === "suspended" && ctx.resume) await ctx.resume();
    // a Stop, or a change of source, while the picker, the decode or the resume was open:
    // give the capture back. Checked AFTER the last await -- nothing below yields.
    if (gen !== music.gen || music.audio) { musicStopStream(S.stream); S = null; return; }
    const route = musicRouting(kind, S.suppressed, S.surface);
    const an = ctx.createAnalyser();
    an.fftSize = MUSIC_NFFT;
    an.smoothingTimeConstant = 0;                  // the raw spectrum of the last window
    S.node.connect(an);                            // the analyser is a dead end: it feeds nothing
    let delay = null;
    // the ONLY place anything is connected to the speakers. musicRouting never says `play` for
    // an input device; the second test is there so that no later edit of it can make a
    // microphone feed back.
    if (route.play && kind !== "input") {
      delay = ctx.createDelay(1);
      S.node.connect(delay);
      delay.connect(ctx.destination);
    }
    music.db = new Float32Array(an.frequencyBinCount);
    music.mag = new Float64Array(an.frequencyBinCount);
    // a NEW detector for every source: its running normalisation and reference describe the
    // audio it has heard, and carried across a switch they would misjudge the next one
    music.det = new MusicDetector({ sr: ctx.sampleRate, nfft: MUSIC_NFFT, nbands: music.plan.sigmas.length,
                                    fps: MUSIC_FPS, threshold: u.thr,
                                    fluxFloor: MUSIC_FLUX_FLOOR, peakDecayS: MUSIC_PEAK_DECAY });
    music.tPush = null;
    music.clock = {};                              // a new session: no anchor, no BEHIND left over
    music.behind = false;
    music.queue.length = 0;
    music.hidden = false;
    const A = { ctx: ctx, an: an, node: S.node, delay: delay, t0: ctx.currentTime, kind: kind,
                click: S.click, stream: S.stream, route: route, suppressed: S.suppressed, surface: S.surface,
                label: S.label, settings: S.settings || null, sync: null };
    if (S.stream) {
      // the capture ending from outside: Chrome's "Stop sharing", the tab closed, the device
      // unplugged. ANY track ending ends the session -- but only THIS session: the handler
      // of a capture that has already been replaced must not stop its successor.
      for (const t of S.stream.getTracks())
        t.onended = () => { if (music.audio === A) { musicStop(); showStatus("the " + (kind === "tab" ? "tab capture" : "audio input") + " ended", "info"); } };
    } else {
      S.node.onended = () => { if (music.audio === A) musicStop(); };
      S.node.start();
    }
    A.t0 = ctx.currentTime;                        // audio time 0 = the source's first sample
    musicSyncApply(A, true);
    music.audio = A;
    S = null;                                      // owned by the session from here on
    if (MUSIC_DEBUG) musicDebugInit();
    musicRunning(true);
    showStatus(kind === "tab" && route.play === false && A.surface !== "browser"
               ? "that capture is not a browser tab: it is analysed, not played -- pick a Chrome TAB for a synced picture" : "", "info");
    syncLabels();
    if (kind === "input") musicDevices();          // the labels exist now
  } catch (e) {
    // anything thrown after the capture was granted: do not leave it running
    showStatus("could not start: " + (e && e.message || e), "err");
  } finally {
    if (S) {                                       // acquired, and never handed to a session
      musicStopStream(S.stream);
      try { S.node.disconnect(); } catch (e) { /* never connected */ }
    }
    music.starting = false;
  }
}
function musicStop() {
  const A = music.audio;
  music.audio = null;
  music.gen++;                                   // whatever Start is still awaiting gives up
  musicRunning(false);
  music.clock = {};                              // the anchor AND the BEHIND hold: audio times
  music.behind = false;                          //   of a session that is over mean nothing
  music.queue.length = 0;
  music.hidden = false;
  if (!A) { syncLabels(); return; }
  if (A.stream) musicStopStream(A.stream);
  else { A.node.onended = null; try { A.node.stop(); } catch (e) { /* already ended */ } }
  try { A.node.disconnect(); A.an.disconnect(); if (A.delay) A.delay.disconnect(); } catch (e) { /* nothing connected */ }
  syncLabels();
}
// the trim slider, live
function musicTrimApply() {
  if (music.audio) musicSyncApply(music.audio, false);
  syncLabels();
}

// ---- one frame -----------------------------------------------------------------
// `sv` is the live solver. Returns the number of steps the loop is to take this frame.
async function musicStep(sv) {
  const A = music.audio;
  if (!A) return 0;
  const tA = A.ctx.currentTime - A.t0, u = musicUi();
  // the stats readback the count is computed from: the last frame's, and only if nothing
  // has moved the state since (a Reset or a rebuild leaves it describing a state that is
  // gone -- then this frame takes no step and the readback at its end is the fresh one).
  // Read BEFORE the kicks below, which move the mark themselves.
  const s = statsCache.s, fresh = !!s && statsCache.at === stateMark();
  // a state that has gone non-finite cannot be stepped back: say so and stop, instead of
  // sitting there with a clock that returns "no steps" for ever
  if (fresh && !(isFinite(s[1]) && isFinite(s[2]) && isFinite(s[3]))) {
    musicStop();
    showStatus("the simulation went non-finite (too large an amp or cfl?) -- press Reset, then Start", "err");
    return 0;
  }
  // back from a hidden tab: whatever was waiting belongs to audio that has long played
  const resumed = music.hidden;
  music.hidden = false;
  if (resumed) music.queue.length = 0;
  // the output device can change under a session (earphones connected): look once a second
  if (tA - music.syncAt >= 1) { musicSyncApply(A, false); musicModeLine(); }
  if (musicShouldPush(tA, music.tPush, MUSIC_FPS)) {
    music.tPush = tA;
    A.an.getFloatFrequencyData(music.db);
    const db = music.db, mag = music.mag;
    for (let k = 0; k < mag.length; k++) mag[k] = Math.pow(10, db[k] / 20);   // -Infinity dB -> 0
    // every onset WAITS for the hold-back before it kicks (0 where the sound is delayed
    // instead): due at the audio time it was declared plus H
    for (const o of music.det.push(mag, tA)) music.queue.push({ due: tA + A.sync.H, o: o });
  }
  let nk = 0, eBefore = fresh ? s[2] + s[3] : NaN;
  // ... and the ones that are due kick now, in the order they were declared (the head of the
  // queue first: a later onset never overtakes an earlier one, even if H has just shrunk)
  while (music.queue.length && music.queue[0].due <= tA) {
    const q = music.queue.shift(), o = q.o;
    // ONE kick per onset: KICK_MAX holds one band's blobs, and two onsets merged into
    // one list could need twice that and would lose the overflow
    const r = sv.kick(musicKickList(music.rng, music.plan, o.band, u.amp, o.strength));
    nk++;
    music.dropped += r.dropped;
    music.lit[o.band] = performance.now();
    if (MUSIC_DEBUG) {
      // the energy a kick adds enters no accumulator: difference two readbacks
      const k = { tOnset: o.t, tFire: o.tFire, tDue: q.due, tApplied: A.ctx.currentTime - A.t0, band: o.band,
                  strength: o.strength, eBefore: NaN, eAfter: NaN, simT: fresh ? s[1] : NaN,
                  used: r.used, dropped: r.dropped, sched: musicSched(A, o.t) };
      window.musicDebug.kicks.push(k);
      if (MUSIC_DEBUG_E) {
        const sa = await sv.readStats();
        if (solver !== sv || music.audio !== A) return 0;
        k.eBefore = eBefore;
        k.eAfter = sa[2] + sa[3];
        eBefore = k.eAfter;
      }
    }
  }
  let c = { n: 0, target: NaN, lag: NaN, rebased: false, behind: music.behind };
  if (fresh)
    c = musicClock(music.clock, { running: true, audioT: tA, simT: s[1], dt: s[0], rate: u.rate,
                                  maxSteps: MUSIC_MAX_STEPS, lagMax: MUSIC_LAG_MAX,
                                  maxAhead: u.rate / MUSIC_FPS, kicked: nk > 0, resumed: resumed });
  else if (resumed) music.hidden = true;           // no readback to re-anchor on yet: next frame
  music.behind = c.behind;
  musicStrip();
  if (MUSIC_DEBUG) musicDebugFrame(tA, s, fresh, c, nk);
  return c.n;
}

// ---- ?musicdebug ------------------------------------------------------------------
// window.musicDebug, for measuring sync and latency in a real browser without extra code:
//   kicks   one record per kick -- tOnset (audio s, the analysis-window centre of the peak
//           frame), tFire (audio s when the detector declared it), tDue (tFire + the
//           hold-back then in force), tApplied (audio s when kick() returned), band,
//           strength, simT, used, dropped, and for the click track
//           `sched`: the nearest scheduled click { t, kind, dt = tOnset - t }. With
//           ?musicdebug=energy also eBefore / eAfter, the total energy from stats
//           readbacks either side of THAT kick (NaN otherwise)
//   frames  one record per frame -- a (audio s), target, simT, lag (s of audio, + behind;
//           taken BEFORE the frame's steps) and lagAfter (expected once they are taken),
//           n (steps asked for), dt and e (the readback the count was computed from: the
//           previous frame's), rebased, kicks, fresh
//   summary() the numbers MUSIC_PLAN M2 asks a browser session for
// Audio times are seconds since the source started. Records are capped (the last
// 40000 frames, ~11 minutes at 60 Hz).
function musicSched(A, t) {
  if (!A.click) return null;
  const c = A.click, tl = ((t % c.duration) + c.duration) % c.duration;
  let best = null;
  for (const e of c.events) for (const off of [-c.duration, 0, c.duration]) {
    const d = tl - (e.t + off);
    if (best === null || Math.abs(d) < Math.abs(best.dt)) best = { t: t - d, kind: e.kind, dt: d };
  }
  return best;
}
// what was playing, how it was routed and how it is being kept in sync: everything a
// browser session needs to report
function musicDebugAudio(A) {
  const sy = A.sync || { D: 0, H: 0, lout: 0, ldet: MUSIC_LDET, trim: 0, residual: 0 };
  return { kind: A.kind, label: A.label, sampleRate: A.ctx.sampleRate, baseLatency: A.ctx.baseLatency,
           outputLatency: A.ctx.outputLatency, compensated: A.route.compensated, played: A.route.play,
           delayMs: 1000 * sy.D, holdMs: 1000 * sy.H, trimMs: 1000 * sy.trim, ldetMs: 1000 * sy.ldet,
           outputLatencyUsedMs: 1000 * sy.lout, residualMs: 1000 * sy.residual,
           suppressed: A.suppressed, surface: A.surface, mode: musicSyncText(sy, A.route.why),
           bpm: A.click ? A.click.bpm : null, trackSettings: A.settings,
           videoTrackAlive: A.stream ? A.stream.getVideoTracks().some(t => t.readyState === "live") : null,
           nfft: MUSIC_NFFT, bins: A.an.frequencyBinCount };
}
function musicDebugInit() {
  const A = music.audio;
  window.musicDebug = {
    kicks: [], frames: [], rebases: 0,
    audio: musicDebugAudio(A),
    plan: music.plan, edges: music.det.edges.slice(),
    summary: musicDebugSummary
  };
}
function musicDebugFrame(tA, s, fresh, c, nk) {
  const D = window.musicDebug;
  if (!D) return;
  if (c.rebased) D.rebases++;
  // `lag` is measured BEFORE this frame's steps, from the previous frame's readback, so in
  // a steady run it is about one frame's advance by construction. `lagAfter` is where the
  // frame is expected to END (lag minus the n steps about to be taken, at the dt in hand):
  // that is the number to hold against "within a frame of the audio".
  D.frames.push({ a: tA, target: c.target, simT: fresh ? s[1] : NaN, lag: c.lag, n: c.n,
                  lagAfter: fresh ? c.lag - c.n * s[0] / musicUi().rate : NaN,
                  dt: fresh ? s[0] : NaN, e: fresh ? s[2] + s[3] : NaN, rebased: c.rebased, kicks: nk,
                  fresh: fresh });
  if (D.frames.length > 40000) D.frames.splice(0, D.frames.length - 40000);
}
// the three numbers, each over the records after `skip` seconds of audio (default 5: the
// detector's warm-up and the flow's spin-up)
function musicDebugSummary(skip) {
  const D = window.musicDebug, t0 = skip === undefined ? 5 : skip;
  const fr = D.frames.filter(f => f.a >= t0 && f.fresh && isFinite(f.lag));
  const st = a => { if (!a.length) return { n: 0 };
                    const m = a.reduce((x, y) => x + y, 0) / a.length;
                    return { n: a.length, mean: m, min: Math.min.apply(null, a), max: Math.max.apply(null, a) }; };
  const out = { seconds: fr.length ? fr[fr.length - 1].a - fr[0].a : 0, frames: fr.length,
                rebases: D.frames.filter(f => f.a >= t0 && f.rebased).length,
                lagSeconds: st(fr.map(f => f.lag)), lagAfterSeconds: st(fr.map(f => f.lagAfter)),
                stepsPerFrame: st(fr.map(f => f.n)),
                framesAtCap: fr.filter(f => f.n >= MUSIC_MAX_STEPS).length, audio: D.audio, bands: [] };
  for (let b = 0; b < music.plan.sigmas.length; b++) {
    const ks = D.kicks.filter(k => k.band === b && k.tOnset >= t0);
    const jump = ks.filter(k => k.eBefore > 0 && isFinite(k.eAfter)).map(k => (k.eAfter - k.eBefore) / k.eBefore);
    out.bands.push({ band: b, kicks: ks.length, energyJump: st(jump),
                     // sound -> kick: the audio time the kick was applied minus the onset's
                     latencySeconds: st(ks.map(k => k.tApplied - k.tOnset)),
                     // ... and, on the click track, minus the click's SCHEDULED time
                     latencyFromScheduled: st(ks.filter(k => k.sched && Math.abs(k.sched.dt) < 0.06)
                                                .map(k => k.tApplied - k.sched.t)) });
  }
  return out;
}

// ---- boot -----------------------------------------------------------------------
async function boot() {
  groupsInit();
  syncLabels();
  if (!await initGPU({ maxLimits: true })) return;
  cardsInit({
    fields: DISP_FIELDS,
    zslice: false, nz: () => 1, zsliceOf: () => 0,
    offset: true,
    aspect: cardAspect,
    onLayout: syncLabels
  });
  el("btnRun").onclick = () => { if (running) musicStop(); else musicStart(); };
  el("btnRun").textContent = "Start";
  el("btnReset").onclick = () => applyIC();
  el("selSrc").onchange = () => { if (running || music.starting) musicStop(); syncLabels();
                                  if (el("selSrc").value === "input") musicDevices(); };
  el("selDev").onchange = () => { if (running && music.audio && music.audio.kind === "input") musicStop(); };
  el("rTrim").oninput = musicTrimApply;
  // back from a hidden tab: the next frame re-anchors quietly instead of calling the
  // absence "behind". (An ASSIGNED handler: devtools' stub document has no addEventListener.)
  if (typeof document !== "undefined")
    document.onvisibilitychange = () => { if (document.visibilityState === "hidden") music.hidden = true; };
  // another file chosen while one plays: stop it (the next Start plays the new one)
  el("fMusic").onchange = () => { if (music.audio && music.audio.kind === "file") musicStop(); };
  for (const id of ["rThr", "rMem", "rMAmp", "rRate", "rCfl", "rCflEvery"]) el(id).oninput = applyControls;
  el("nBpm").onchange = () => { if (running && music.audio && music.audio.kind === "click") musicStop(); syncLabels(); };
  stepHook = musicStep;
  // what a saved params.json says drove the run (common.js _forcingRecord fills in the rest)
  manifestForcing = () => {
    const u = musicUi(), A = music.audio;
    return { source: A ? A.kind : u.src, compensated: A ? A.route.compensated : null,
             delayMs: (A && A.sync) ? 1000 * A.sync.D : 0, holdMs: (A && A.sync) ? 1000 * A.sync.H : 0,
             trimMs: u.trim,
             bpm: (A && A.click) ? A.click.bpm : null, threshold: u.thr,
             memory: u.memory, amp: u.amp, rate: u.rate, mu: solver ? solver.p.mu : null,
             bands: music.plan.sigmas.length, sigmas: music.plan.sigmas, nblobs: music.plan.nblobs,
             seed: MUSIC_SEED };
  };
  rebuild();
  // |u| is where a kick shows (7-13x the baseline frame change against 1.5x in vorticity)
  cardsLayout({ disp: [{ sel: 4, cmap: MUSIC_CMAP_DEFAULT }], charts: ["energy", "spectrum"] });
  loop();
}
boot();
</script>
